name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.96.0
          extra_args: --only-verified

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/shared
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: extension/shared/package-lock.json
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:release

  firefox-source-submission:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/firefox-extension-submission
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: extension/firefox-extension-submission/package-lock.json
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
